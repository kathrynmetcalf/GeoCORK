name: PyInstaller

on: [workflow_dispatch]

jobs:
  pyinstaller-build:
    runs-on: windows-latest
    steps:
      - name: Create Executable
        uses: sayyid5416/pyinstaller@v1
        with:
          python_ver: '3.11.6'
          spec: 'mainAppEngine.spec'
          requirements: 'requirements.txt'
          upload_exe_with_name: 'GeoCORK windows'
          options: --onedir, --name "GeoCORK", --windowed, 
