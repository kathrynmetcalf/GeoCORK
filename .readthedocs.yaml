# Read the Docs configuration: https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # System libraries PyQt6 / QtWebEngine need to import headlessly
  apt_packages:
    - libegl1
    - libgl1
    - libxkbcommon0
    - libxkbcommon-x11-0
    - libdbus-1-3
    - libfontconfig1
    - libglib2.0-0
    - libnss3
    - libxcomposite1
    - libxdamage1
    - libxrandr2
    - libxtst6
    - libxi6
    - libasound2t64

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
